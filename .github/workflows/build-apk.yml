name: Build Android APK (Godot)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.2.2
  EXPORT_NAME: OneMinuteToDie

jobs:
  export-android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot templates and Android settings
        run: |
          if [ "$HOME" != "/root" ]; then
            mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
            mv /root/.config/godot ~/.config/godot
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi

      - name: Import project resources
        run: timeout 240 godot --headless --editor --quit || true

      - name: Export debug APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" "$(pwd)/build/android/${EXPORT_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: one-minute-to-die-apk
          path: build/android/OneMinuteToDie.apk
          if-no-files-found: error
